name: pages

# Publishes the app to GitHub Pages, and -- this is the part that matters -- rebuilds the
# projections from fresh data on a schedule so the hosted page does not rot.
#
# Two shapes of run:
#
#   push          deploy the app as committed. The pack in the repo is used as-is, so a
#                 code change ships in about two minutes without touching the data.
#   schedule      re-fetch every volatile source, refit the projections, then deploy.
#                 Injury reports, depth charts, rosters, box scores and betting lines all
#                 move through the week; this is what keeps the page current between pushes.
#
# The rebuilt pack is deliberately NOT committed back. It is 2MB, it changes every day,
# and committing it would add many gigabytes a year of git history for data that is
# reproducible from `pipeline/refresh.py` in a minute. The repo keeps a known-good pack
# for local use; the hosted page gets a fresh one every six hours.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/tests.yml'
  schedule:
    # Every six hours, rather than once a morning.
    #
    # A daily rebuild is never more than a day stale, which sounds fine and is not: the
    # things that move during a football week do not wait for the morning. Wednesday and
    # Thursday practice reports post in the afternoon, game designations land Friday
    # evening, the consensus board rescrapes continuously, and betting lines fill in as
    # they are posted. A once-a-day build sees all of it late by up to 24 hours.
    #
    # Four runs is cheap -- Actions minutes are free on a public repo and a warm-cache
    # rebuild takes about four minutes -- and it caps staleness at six hours without
    # anyone having to reason about which day of the week it is.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-fetch the data and refit the projections'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one halfway -- a cancelled deploy can leave
# Pages serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two GitHub rules have to line up for the daily rebuild to publish, and when they do
  # not, nothing about the failure says why:
  #
  #   * Scheduled workflows run on the DEFAULT branch and nowhere else.
  #   * This repo's `github-pages` environment accepts deployments from `main` and
  #     nowhere else.
  #
  # Measured, not assumed. The identical workflow deployed from `main` and was refused
  # from a non-main default branch -- refused in one second, with no runner assigned, no
  # steps and no logs, which reads like infrastructure being broken rather than like a
  # setting being wrong. It cost an hour and a wrong diagnosis (the repo's visibility)
  # before the two-run comparison settled it.
  #
  # So if the default branch is not `main`, fail here and say so, rather than building
  # for two minutes and dying at the deploy, or skipping quietly and leaving the page to
  # rot while every run shows green.
  guard:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Wrong branch for a Pages deploy
        run: |
          echo "::error title=Pages cannot deploy from ${{ github.ref_name }}::The github-pages environment accepts deployments only from 'main'. Set Settings -> General -> Default branch to 'main' so the daily refresh both runs and publishes."
          exit 1

  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      REFRESH: ${{ github.event_name == 'schedule' || github.event.inputs.refresh == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        if: env.REFRESH == 'true'
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: env.REFRESH == 'true'
        run: pip install -r pipeline/requirements.txt

      # Seven seasons of history and 300MB of play-by-play do not change. Cache them, and
      # the daily run only pulls the things that actually moved. The key is hashed over
      # the two files that decide what the cache should contain, so editing either one
      # rebuilds it and nothing else does.
      - name: Restore the nflverse cache
        if: env.REFRESH == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: nflverse-v1-${{ hashFiles('pipeline/sources.py', 'pipeline/bootstrap.py') }}
          restore-keys: nflverse-v1-

      - name: Fetch anything missing
        if: env.REFRESH == 'true'
        run: python3 pipeline/bootstrap.py

      # continue-on-error on purpose. If nflverse is down or a schema moved, the right
      # outcome is yesterday's projections, not a broken site.
      - name: Refresh the data and refit the projections
        id: refresh
        if: env.REFRESH == 'true'
        continue-on-error: true
        run: python3 pipeline/refresh.py

      - name: Fall back to the committed pack
        if: env.REFRESH == 'true' && steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Data refresh failed::Deploying the pack committed to the repo. The page will show its real age."
          git checkout -- app/data

      - name: Bundle the single-file build
        run: node scripts/bundle.mjs

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Gate the deploy on the app actually working with whatever data just got built.
      # A failure here leaves the previous deploy in place, which is the correct answer:
      # a day-old page beats a broken one.
      - name: Browser verification
        run: node scripts/verify-browser.mjs

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/. _site/
          cp dist/tradedesk.html _site/tradedesk.html
          touch _site/.nojekyll
          echo "site contents:"
          find _site -type f | sort | sed 's/^/  /'
          echo "pack: $(grep -o '"generated":"[^"]*"' _site/data/pack.js | head -1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
